<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f19">
    <title>Pronos Camiloven</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
    </script>
    <style>
        body {
            background:
                radial-gradient(1200px 600px at 80% -10%, rgba(16,185,129,.10), transparent 60%),
                radial-gradient(900px 500px at -10% 20%, rgba(245,158,11,.06), transparent 60%),
                #0b0f19;
            color: #e2e8f0;
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
        }
        .card {
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 18px;
            padding: 22px;
            margin: 14px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,.35);
            backdrop-filter: blur(6px);
            transition: border-color .2s, transform .15s;
        }
        .card:hover { border-color: rgba(16,185,129,.45); transform: translateY(-1px); }
        .tab {
            padding: 10px 22px;
            border-radius: 9999px;
            font-weight: 700;
            white-space: nowrap;
            margin: 4px;
            transition: all .2s;
            border: 1px solid transparent;
        }
        .tab:hover { border-color: rgba(16,185,129,.5); }
        #dropzone { border: 2px dashed rgba(255,255,255,.18); border-radius: 18px; transition: all .2s; }
        #dropzone.dragover { border-color: #10b981; background: rgba(16,185,129,.08); }
        ::selection { background: rgba(16,185,129,.35); }
    </style>
</head>
<body class="pb-12">

    <header class="relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-r from-emerald-800 via-emerald-700 to-teal-700"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-black/30"></div>
        <div class="absolute -top-20 -right-20 w-72 h-72 bg-emerald-400/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 -left-16 w-72 h-72 bg-teal-400/20 rounded-full blur-3xl"></div>
        <div class="relative p-8 text-center">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-black/25 text-amber-300 text-[11px] font-bold tracking-[.3em] uppercase mb-4">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-300 animate-pulse"></span>
                High Probability Picks
            </div>
            <h1 class="text-4xl sm:text-5xl font-black tracking-tight text-white drop-shadow-lg">PRONOS CAMILOVEN</h1>
            <p class="mt-2 text-emerald-100/80 text-sm font-medium">Análisis y pronósticos deportivos con datos de IA</p>
        </div>
    </header>

    <div class="grid grid-cols-3 gap-3 p-6 max-w-3xl mx-auto">
        <button onclick="window.open('https://www.betmines.com/es','_blank')" class="bg-white/5 border border-white/10 hover:bg-emerald-500/10 hover:border-emerald-400/40 p-4 rounded-2xl text-center text-sm font-semibold transition">Betmines</button>
        <button onclick="window.open('https://www.forebet.com/es/predicciones','_blank')" class="bg-white/5 border border-white/10 hover:bg-emerald-500/10 hover:border-emerald-400/40 p-4 rounded-2xl text-center text-sm font-semibold transition">Forebet</button>
        <button onclick="window.open('https://www.adamchoi.co.uk/','_blank')" class="bg-white/5 border border-white/10 hover:bg-emerald-500/10 hover:border-emerald-400/40 p-4 rounded-2xl text-center text-sm font-semibold transition">AdamChoi</button>
    </div>

    <div class="px-6 max-w-3xl mx-auto">
        <button onclick="document.getElementById('fileInput').click()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-black py-6 rounded-2xl font-black text-lg shadow-lg shadow-emerald-900/40 hover:from-emerald-400 hover:to-teal-400 hover:-translate-y-0.5 active:translate-y-0 transition">
            📁 CARGAR EXCEL
        </button>
        <div id="dropzone" class="mt-4 p-6 text-center text-sm text-gray-400 rounded-2xl bg-white/[.02]">
            O arrastra tu archivo .xlsx aquí
        </div>
        <input type="file" id="fileInput" accept=".xlsx,.xls" class="hidden">
        <div id="status" class="mt-3 text-center text-sm text-gray-400"></div>
    </div>

    <div id="sportTabs" class="flex flex-wrap justify-center gap-2 px-6 py-4"></div>
    <div class="px-6 pb-4 flex justify-center items-center gap-2 text-sm">
        <span class="text-gray-500 font-medium">Hora:</span>
        <button id="zonaAuto" class="tab bg-emerald-500 text-black">Mi celular</button>
        <button id="zonaChile" class="tab bg-white/10 text-white">Chile</button>
    </div>
    <div id="content" class="px-6 max-w-3xl mx-auto"></div>

<script>
let allData = {};
let zona = 'auto'; // 'auto' = hora del celular, 'chile' = America/Santiago
let tabActivo = 'todos';

// Zona horaria actual del dispositivo
function obtenerTZ() {
    if (zona === 'chile') return 'America/Santiago';
    return Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Santiago';
}

// ---------- Fechas y horas ----------

// Interpreta una fecha/hora "naive" (sin zona) como hora de Chile
// y devuelve el instante absoluto en milisegundos
function componenteAUtc(tz, y, m, d, hh, mm) {
    const dtf = new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false });
    const guess = new Date(Date.UTC(y, m - 1, d, hh, mm) - 4 * 3600 * 1000);
    for (let i = 0; i < 6; i++) {
        const parts = dtf.formatToParts(guess);
        const get = (t) => parseInt(parts.find(p => p.type === t)?.value || '0', 10);
        const wallUtc = Date.UTC(get('year'), get('month') - 1, get('day'), get('hour'), get('minute'), get('second'));
        const delta = guess.getTime() - wallUtc;
        const next = new Date(Date.UTC(y, m - 1, d, hh, mm) + delta);
        if (next.getTime() === guess.getTime()) return next;
        guess.setTime(next.getTime());
    }
    return guess;
}

// Número de fecha de Excel (serial) -> componentes
function serialAComps(n) {
    const dt = new Date((n - 25569) * 86400 * 1000);
    return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate(), hh: dt.getUTCHours(), mm: dt.getUTCMinutes() };
}

// Extrae año/mes/día/hora/min de una cadena flexible
function extraerComponentes(s) {
    let y = null, m = null, d = null, hh = 0, mm = 0;
    let mF = s.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
    if (mF) { y = +mF[1]; m = +mF[2]; d = +mF[3]; }
    else {
        mF = s.match(/(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
        if (mF) { d = +mF[1]; m = +mF[2]; y = +mF[3]; }
    }
    const tF = s.match(/(\d{1,2})[:h](\d{2})/);
    if (tF) { hh = +tF[1]; mm = +tF[2]; }
    if (y === null) return null;
    return { y, m, d, hh, mm };
}

// Parsea un valor de fecha del Excel a instante absoluto (ms)
function parseFecha(valor) {
    const n = limpiarNumero(valor);
    let comps = null;
    if (n !== null && n > 20000 && n < 60000) {
        comps = serialAComps(n);
    } else {
        const s = String(valor).trim();
        if (!s) return null;
        comps = extraerComponentes(s);
        if (!comps) {
            const t = Date.parse(s);
            return isNaN(t) ? null : t;
        }
    }
    // Si falta la fecha, usar el día de hoy
    if (comps.y === null) {
        const now = new Date();
        comps.y = now.getFullYear(); comps.m = now.getMonth() + 1; comps.d = now.getDate();
    }
    return componenteAUtc('America/Santiago', comps.y, comps.m, comps.d, comps.hh, comps.mm).getTime();
}

function diaEnTz(ts, tz) {
    const dtf = new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: 'numeric', day: 'numeric' });
    const p = dtf.formatToParts(ts ? new Date(ts) : new Date());
    const get = (t) => parseInt(p.find(x => x.type === t)?.value || '0', 10);
    return Date.UTC(get('year'), get('month') - 1, get('day'));
}

function formatearHora(ts) {
    if (ts === undefined || ts === null) return '';
    const tz = obtenerTZ();
    const d = new Date(ts);
    const hoy = diaEnTz(null, tz);
    const dia = diaEnTz(ts, tz);
    const diff = Math.round((dia - hoy) / 86400000);
    let label;
    if (diff === 0) label = 'Hoy';
    else if (diff === 1) label = 'Mañana';
    else if (diff === -1) label = 'Ayer';
    else {
        label = new Intl.DateTimeFormat('es-CL', { timeZone: tz, day: 'numeric', month: 'short' }).format(d);
    }
    const hora = new Intl.DateTimeFormat('es-CL', { timeZone: tz, hour: '2-digit', minute: '2-digit' }).format(d);
    return `${label} · ${hora}`;
}

// Ordena una lista por hora de inicio (los sin hora quedan al final)
function ordenarPorHora(lista) {
    lista.forEach(p => {
        if (p._ts === undefined) p._ts = p.date ? parseFecha(p.date) : null;
        if (p._ts === undefined) p._ts = null;
    });
    lista.sort((x, y) => {
        const a = x._ts === null ? Infinity : x._ts;
        const b = y._ts === null ? Infinity : y._ts;
        return a - b;
    });
    return lista;
}

if (localStorage.getItem('pronosticosData')) {
    try {
        allData = JSON.parse(localStorage.getItem('pronosticosData'));
        Object.values(allData).forEach(ordenarPorHora);
    } catch (e) {
        allData = {};
    }
}

// ---------- Parseo flexible del Excel ----------

function limpiarNumero(v) {
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'number') return v;
    const s = String(v).trim().replace(/%$/, '').replace(',', '.');
    const n = parseFloat(s);
    return isNaN(n) ? null : n;
}

function normalizarClaves(fila) {
    const norm = {};
    Object.keys(fila).forEach(k => {
        norm[String(k).toLowerCase().trim().replace(/\s+/g, ' ')] = fila[k];
    });
    return norm;
}

// Busca la primera columna (de las candidatas) que exista y no esté vacía
function buscar(fila, candidatas) {
    for (const c of candidatas) {
        const v = fila[c];
        if (v !== undefined && v !== null && v !== '') return v;
    }
    return undefined;
}

// Busca candidata cuyo valor sea texto (para nombres de equipos)
function buscarTexto(fila, candidatas) {
    for (const c of candidatas) {
        const v = fila[c];
        if (v !== undefined && v !== null && v !== '' && limpiarNumero(v) === null) return v;
    }
    return undefined;
}

// Busca candidata cuyo valor sea numérico (para probabilidades)
function buscarNum(fila, candidatas) {
    for (const c of candidatas) {
        const v = fila[c];
        if (limpiarNumero(v) !== null) return v;
    }
    return undefined;
}

// Convierte a probabilidad 0-1 (acepta 0.75 o 75)
function aProb(v) {
    const n = limpiarNumero(v);
    if (n === null) return 0;
    return n > 1 ? n / 100 : n;
}

function parsearFila(raw) {
    const f = normalizarClaves(raw);
    const p = {};

    const fecha = buscar(f, ['date', 'fecha', 'dia', 'horario', 'fecha/hora', 'fecha hora', 'datetime', 'fecha y hora']);
    const local = buscarTexto(f, ['home', 'equipo local', 'equipo_local', 'local team', 'home team', 'casa', 'local', 'equipo']);
    const visita = buscarTexto(f, ['away', 'equipo visitante', 'equipo_visitante', 'away team', 'visitante', 'visita', 'equipo b']);
    const h = buscarNum(f, ['1x2_h', '1x2 h', '1x2 home', '1x2_home', 'prob local', 'local win', 'local_win', 'gana local', 'ganalocal', 'h1x2', 'h1', 'local']);
    const d = buscarNum(f, ['1x2_d', '1x2 d', '1x2 draw', '1x2_draw', 'prob empate', 'draw prob', 'empate', 'prob x', 'x']);
    const a = buscarNum(f, ['1x2_a', '1x2 a', '1x2 away', '1x2_away', 'prob visitante', 'away win', 'away_win', 'gana visitante', 'ganavisitante', 'a2', 'visita', 'visitante']);

    p.date = fecha !== undefined ? String(fecha) : '';
    p._ts = fecha !== undefined ? parseFecha(fecha) : null;
    p.home = local !== undefined ? String(local).trim() : '';
    p.away = visita !== undefined ? String(visita).trim() : '';
    p['1x2_h'] = aProb(h);
    p['1x2_d'] = aProb(d);
    p['1x2_a'] = aProb(a);

    // Over/Under: reconoce columnas como "Over 2.5", "Under 1.5", "o_2.5", "u_3.5", "O2.5", "U2.5"
    Object.keys(f).forEach(k => {
        const m = k.match(/^(?:over|mas|más|o)[\s_]*(?:goles\s*)?(\d+(?:[.,]\d+)?)$/i);
        if (m) p['o_' + m[1].replace(',', '.')] = aProb(f[k]);
        const m2 = k.match(/^(?:under|menos|u)[\s_]*(?:goles\s*)?(\d+(?:[.,]\d+)?)$/i);
        if (m2) p['u_' + m2[1].replace(',', '.')] = aProb(f[k]);
    });

    return p;
}

function parsearLibro(wb) {
    const data = {};
    wb.SheetNames.forEach(nombre => {
        const filas = XLSX.utils.sheet_to_json(wb.Sheets[nombre], { defval: '' });
        const limpias = filas.map(parsearFila).filter(r => r.home || r.away);
        if (limpias.length > 0) data[nombre] = limpias;
    });
    return data;
}

// ---------- Render ----------

function renderTabs() {
    const container = document.getElementById('sportTabs');
    container.innerHTML = '';

    const btnTodos = document.createElement('button');
    btnTodos.textContent = 'TODOS';
    btnTodos.className = `tab ${tabActivo === 'todos' ? 'bg-emerald-500 text-black' : 'bg-white/10 text-white'}`;
    btnTodos.onclick = () => { tabActivo = 'todos'; renderTabs(); mostrarDeporte('todos'); };
    container.appendChild(btnTodos);

    Object.keys(allData).forEach(sport => {
        const btn = document.createElement('button');
        btn.textContent = sport.toUpperCase();
        btn.className = `tab ${tabActivo === sport ? 'bg-emerald-500 text-black' : 'bg-white/10 text-white'}`;
        btn.onclick = () => { tabActivo = sport; renderTabs(); mostrarDeporte(sport); };
        container.appendChild(btn);
    });
}

function mostrarDeporte(sport) {
    let data, titulo;
    if (sport === 'todos') {
        titulo = 'Todos los partidos';
        data = [];
        Object.keys(allData).forEach(nombre => {
            allData[nombre].forEach(p => data.push(Object.assign({}, p, { _deporte: nombre })));
        });
    } else {
        titulo = sport;
        data = allData[sport] || [];
    }
    data = ordenarPorHora(data);
    let html = `<h2 class="text-emerald-400 text-3xl font-black mb-2 px-2 capitalize">${titulo}</h2>
        <p class="text-gray-500 text-sm mb-6 px-2">${data.length} partidos cargados · ordenados por hora</p>`;

    data.forEach(p => {
        const h = Math.round((p['1x2_h'] || 0) * 100);
        const d = Math.round((p['1x2_d'] || 0) * 100);
        const a = Math.round((p['1x2_a'] || 0) * 100);

        let ouHTML = '';
        const thresholds = [1.5, 2.5, 3.5];
        thresholds.forEach(th => {
            if (p['o_' + th] !== undefined && p['o_' + th] > 0) {
                ouHTML += `<div class="flex justify-between py-1.5 text-sm"><span class="text-gray-400">Over ${th}</span><span class="text-emerald-400 font-bold">${Math.round(p['o_' + th] * 100)}%</span></div>`;
            }
            if (p['u_' + th] !== undefined && p['u_' + th] > 0) {
                ouHTML += `<div class="flex justify-between py-1.5 text-sm"><span class="text-gray-400">Under ${th}</span><span class="text-rose-400 font-bold">${Math.round(p['u_' + th] * 100)}%</span></div>`;
            }
        });

        const badge = p._deporte
            ? `<span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">${p._deporte}</span>`
            : '';

        html += `
        <div class="card">
            <div class="flex items-center justify-between gap-3">
                ${badge}
                <span class="inline-flex items-center gap-1.5 text-amber-300 font-semibold text-sm ml-auto">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M12 7v5l3 2"/></svg>
                    ${formatearHora(p._ts) || (p.date || 'Sin horario')}
                </span>
            </div>
            <div class="font-bold text-xl mt-3 text-white leading-snug">${p.home} <span class="text-gray-500 font-medium">vs</span> ${p.away}</div>
            <div class="grid grid-cols-3 gap-3 mt-7 text-center">
                <div class="bg-emerald-500/10 border border-emerald-500/20 rounded-2xl py-4"><div class="text-3xl font-black text-emerald-400">${h}%</div><div class="text-[10px] font-bold tracking-widest text-emerald-400/70 mt-1">LOCAL</div></div>
                <div class="bg-sky-500/10 border border-sky-500/20 rounded-2xl py-4"><div class="text-3xl font-black text-sky-400">${d}%</div><div class="text-[10px] font-bold tracking-widest text-sky-400/70 mt-1">EMPATE</div></div>
                <div class="bg-rose-500/10 border border-rose-500/20 rounded-2xl py-4"><div class="text-3xl font-black text-rose-400">${a}%</div><div class="text-[10px] font-bold tracking-widest text-rose-400/70 mt-1">VISITA</div></div>
            </div>
            ${ouHTML ? `<div class="mt-5 bg-black/30 border border-white/5 rounded-2xl p-4">${ouHTML}</div>` : ''}
        </div>`;
    });

    document.getElementById('content').innerHTML = html || '<p class="text-center py-24 text-gray-500">Carga tu Excel</p>';
}

function cargarDatos(data) {
    const total = Object.values(data).reduce((acc, lista) => acc + lista.length, 0);
    if (total === 0) {
        document.getElementById('status').textContent = 'No se encontraron partidos en el archivo.';
        return;
    }
    allData = data;
    Object.values(allData).forEach(ordenarPorHora);
    localStorage.setItem('pronosticosData', JSON.stringify(allData));
    document.getElementById('status').textContent = `${Object.keys(allData).length} deporte(s), ${total} partidos cargados · ordenados por hora`;
    tabActivo = 'todos';
    renderTabs();
    mostrarDeporte('todos');
}

// ---------- Selector de zona horaria ----------

function actualizarZonaUI() {
    document.getElementById('zonaAuto').className = `tab ${zona === 'auto' ? 'bg-emerald-500 text-black' : 'bg-white/10 text-white'}`;
    document.getElementById('zonaChile').className = `tab ${zona === 'chile' ? 'bg-emerald-500 text-black' : 'bg-white/10 text-white'}`;
}

document.getElementById('zonaAuto').onclick = () => { zona = 'auto'; actualizarZonaUI(); rerenderActual(); };
document.getElementById('zonaChile').onclick = () => { zona = 'chile'; actualizarZonaUI(); rerenderActual(); };

function rerenderActual() {
    if (tabActivo) mostrarDeporte(tabActivo);
}

// ---------- Upload ----------

document.getElementById('fileInput').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    leerArchivo(file);
};

const dropzone = document.getElementById('dropzone');
dropzone.addEventListener('click', () => document.getElementById('fileInput').click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) leerArchivo(file);
});

function leerArchivo(file) {
    const reader = new FileReader();
    reader.onload = ev => {
        try {
            const wb = XLSX.read(ev.target.result, { type: 'binary' });
            cargarDatos(parsearLibro(wb));
        } catch (err) {
            alert('Error al leer el Excel. Asegúrate de que sea un archivo .xlsx válido.');
        }
    };
    reader.readAsBinaryString(file);
}

// Cargar datos guardados automáticamente
actualizarZonaUI();
if (Object.keys(allData).length > 0) {
    renderTabs();
    mostrarDeporte('todos');
}
</script>
</body>
</html>
